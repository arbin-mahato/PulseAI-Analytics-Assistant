name: Deploy to Cloud Run - Development environment

on:
  push:
    tags:
      - 'dev*'

jobs:
  deploy:
    name: Migrate & Deploy
    runs-on: ubuntu-latest
    env:
      CLOUD_RUN_SERVICE: client-dev-app
      MIGRATION_JOB_NAME: client-dev-migration
      GCP_ARTIFACT_REPO: client-artifact-repo

    steps:
      # Checkout repo to get commit info
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Find the version tag for this commit
      - name: Find version tag for current commit
        run: |
          # Get all tags pointing to current commit
          VERSION_TAG=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          
          if [ -z "$VERSION_TAG" ]; then
            echo "❌ No version tag (v*) found for this commit!"
            echo "Please tag this commit with a version (e.g., v1.0.1) before deploying."
            exit 1
          fi
          
          echo "Found version tag: $VERSION_TAG"
          IMAGE="asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${GCP_ARTIFACT_REPO}/client-app:${VERSION_TAG}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "🐳 Will deploy image: $IMAGE"

      # Verify image exists in Artifact Registry
      - name: Verify image exists
        run: |
          echo "🔍 Verifying image exists in Artifact Registry..."
          if ! gcloud artifacts docker images describe "$IMAGE" --format="value(name)" 2>/dev/null; then
            echo "❌ Image not found: $IMAGE"
            echo "Please ensure the build workflow has completed for this version tag."
            exit 1
          fi
          echo "✅ Image found in registry"

      # Take snapshot of the database before migrations
      - name: Take database snapshot
        run: |
          echo "📸 Taking database snapshot before migrations..."
          gcloud sql backups create --instance=client-postgres
          echo "✅ Database snapshot completed"
          
      # Update Cloud Run Job for migrations
      - name: Update Cloud Run Job for migrations
        run: |
          echo "🔄 Setting up Cloud Run Job for Prisma migrations..."
         
          gcloud run jobs update $MIGRATION_JOB_NAME \
            --image $IMAGE \
            --region asia-southeast1 \
            --command npx \
            --args "prisma","migrate","deploy" \
            --task-timeout 1800 \
            --max-retries 1 \
            --parallelism 1

      # Execute Prisma migrations via Cloud Run Job
      - name: Run Prisma migrations
        run: |
          echo "🚀 Executing Prisma migrations in Cloud Run Job..."
          gcloud run jobs execute $MIGRATION_JOB_NAME \
            --region asia-southeast1 \
            --wait

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run service: $CLOUD_RUN_SERVICE..."
          gcloud run deploy $CLOUD_RUN_SERVICE \
            --image $IMAGE \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated

          echo "✅ Deployment complete for Development environment!"
