services:
  - type: web
    name: tradelab
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADELAB_DATA_DIR
        value: /app/data
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: ANALYTICS_BACKEND
        value: duckdb
      - key: DATABASE_URL
        fromDatabase:
          name: tradelab-db
          property: connectionString
    disk:
      name: tradelab-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: tradelab-db
    plan: free
    databaseName: tradelab
    user: tradelab
